<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>מזל טוב רוזט - 90</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Suez+One&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#d4af6a;
    --gold-light:#f3e3c3;
    --cream:#faf5ec;
    --deep:#241a12;
    --deep2:#1a120b;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    background:var(--deep);
    overflow:hidden;
    font-family:'Frank Ruhl Libre','Segoe UI',Arial,sans-serif;
    direction:rtl;
  }
  #stage{position:fixed;inset:0;width:100%;height:100%;background:#000;}
  .slide{
    position:absolute;inset:0;width:100%;height:100%;
    opacity:0;transition:opacity 1.1s ease;
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;
  }
  .slide.active{opacity:1;pointer-events:auto;z-index:2;}

  /* ---------- single photo ---------- */
  .slide.photo{background:#000;}
  .slide.photo .imgwrap{position:absolute;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .slide.photo .bgimg{
    position:absolute;top:50%;left:50%;width:112%;height:112%;
    object-fit:cover;transform:translate(-50%,-50%) scale(1);
    animation:kbbg 10s ease-in-out forwards;
  }
  .slide.photo.alt .bgimg{animation-name:kbbg2;}
  .slide.photo .fgimg{
    position:relative;max-width:92%;max-height:88%;
    width:auto;height:auto;object-fit:contain;border-radius:5px;
    box-shadow:0 18px 70px rgba(0,0,0,.65),0 2px 0 rgba(255,255,255,.04);
    animation:kbfg 9s ease-in-out forwards;z-index:1;
  }
  .slide.photo.alt .fgimg{animation-name:kbfg2;}
  @keyframes kbbg{0%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-50%,-50%) scale(1.08)}}
  @keyframes kbbg2{0%{transform:translate(-50%,-50%) scale(1.08)}100%{transform:translate(-50%,-50%) scale(1)}}
  @keyframes kbfg{0%{transform:scale(1)}100%{transform:scale(1.035)}}
  @keyframes kbfg2{0%{transform:scale(1.035)}100%{transform:scale(1)}}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 40%,rgba(0,0,0,.5) 100%);pointer-events:none;z-index:1;}

  /* ---------- collage ---------- */
  .slide.collage{
    background:radial-gradient(ellipse at 50% 40%, #2e2216 0%, var(--deep2) 80%);
  }
  .box{
    position:relative;
    width:calc(100% - 4.5vw);height:calc(100% - 8.0vh);
    animation:gridin 1.1s ease forwards;
  }
  @keyframes gridin{0%{opacity:0;transform:scale(.985)}100%{opacity:1;transform:scale(1)}}
  .cell{
    position:absolute;overflow:hidden;border-radius:6px;background:#120c07;
    box-shadow:0 10px 34px rgba(0,0,0,.6);
    border:3px solid rgba(243,227,195,.14);
  }
  .cell img{
    width:100%;height:100%;object-fit:cover;display:block;
    animation:cellzoom 8s ease-in-out forwards;
  }
  .cell:nth-child(even) img{animation-name:cellzoom2;}
  @keyframes cellzoom{0%{transform:scale(1)}100%{transform:scale(1.05)}}
  @keyframes cellzoom2{0%{transform:scale(1.05)}100%{transform:scale(1)}}

  /* ---------- dividers ---------- */
  .slide.divider{background:radial-gradient(ellipse at center,#2b2013 0%,var(--deep2) 75%);}
  .divider-inner{text-align:center;padding:0 8%;}
  .divider-flourish{font-size:2.2rem;color:var(--gold);margin-bottom:18px;letter-spacing:8px;opacity:.85;}
  .divider-title{
    font-family:'Suez One','Frank Ruhl Libre',serif;
    font-size:clamp(2.2rem,5vw,4rem);color:var(--gold-light);margin:0;
    text-shadow:0 2px 18px rgba(0,0,0,.6);line-height:1.3;
  }
  .divider-line{width:140px;height:2px;background:linear-gradient(to right,transparent,var(--gold),transparent);margin:26px auto 0;}
  .divider-stat{
    margin-top:28px;color:var(--gold);
    font-family:'Suez One',serif;
    font-size:clamp(1.6rem,3.6vw,2.6rem);
  }
  .divider-stat b{font-size:1.5em;color:var(--gold-light);}

  /* ---------- stats ---------- */
  .slide.stats{background:radial-gradient(ellipse at center,#33261654 0%,var(--deep2) 80%),var(--deep2);}
  .stats-inner{text-align:center;padding:0 5%;width:100%;}
  .stats-eyebrow{color:var(--gold);font-size:clamp(1rem,2vw,1.4rem);letter-spacing:4px;margin-bottom:10px;}
  .stats-head{
    font-family:'Suez One',serif;color:var(--gold-light);
    font-size:clamp(1.7rem,4vw,3rem);margin:0 0 6px;
  }
  .stats-total{
    font-family:'Suez One',serif;color:var(--gold);
    font-size:clamp(3.4rem,10vw,7rem);line-height:1;margin:6px 0 4px;
    text-shadow:0 4px 30px rgba(0,0,0,.6);
  }
  .stats-total-label{color:var(--cream);font-size:clamp(1.1rem,2.3vw,1.6rem);opacity:.9;margin-bottom:34px;}
  .stats-row{
    display:flex;justify-content:center;gap:clamp(18px,4vw,64px);flex-wrap:wrap;
  }
  .stat{min-width:110px;}
  .stat .num{
    font-family:'Suez One',serif;color:var(--gold-light);
    font-size:clamp(2.4rem,6vw,4.4rem);line-height:1;
    text-shadow:0 2px 16px rgba(0,0,0,.5);
  }
  .stat .lbl{color:var(--gold);font-size:clamp(.95rem,2vw,1.35rem);margin-top:8px;}
  .stats-foot{margin-top:38px;color:var(--cream);opacity:.8;font-size:clamp(1rem,2.1vw,1.35rem);}

  /* ---------- title / closing ---------- */
  .slide.titleslide,.slide.closing{background:radial-gradient(ellipse at center,#33261654 0%,var(--deep2) 80%),var(--deep2);}
  .title-inner{text-align:center;padding:0 6%;}
  .title-eyebrow{color:var(--gold);font-size:clamp(1rem,2vw,1.4rem);letter-spacing:4px;margin-bottom:14px;opacity:.9;}
  .title-main{font-family:'Suez One',serif;font-size:clamp(3rem,9vw,7rem);color:var(--gold-light);margin:0;text-shadow:0 4px 30px rgba(0,0,0,.7);}
  .title-sub{font-family:'Suez One',serif;color:var(--gold);font-size:clamp(2rem,6vw,4rem);margin:6px 0 0;}
  .title-name{font-size:clamp(2.4rem,7vw,5rem);color:#fff;margin:18px 0 0;font-weight:700;}
  .hearts{margin-top:22px;font-size:1.6rem;color:var(--gold);letter-spacing:14px;}
  .start-hint{position:absolute;bottom:60px;left:0;right:0;text-align:center;color:var(--gold-light);font-size:1rem;opacity:.75;animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:.9}}
  .closing-inner{text-align:center;padding:0 8%;}
  .closing-title{font-family:'Suez One',serif;color:var(--gold-light);font-size:clamp(2.2rem,6vw,4.2rem);line-height:1.4;text-shadow:0 2px 20px rgba(0,0,0,.6);}
  .closing-sub{margin-top:22px;color:var(--gold);font-size:clamp(1.2rem,2.6vw,1.7rem);}

  /* ---------- UI ---------- */
  #ui{position:fixed;inset:0;z-index:10;pointer-events:none;}
  .arrow{
    position:absolute;top:50%;transform:translateY(-50%);
    width:56px;height:56px;border-radius:50%;
    background:rgba(20,15,10,.35);border:1px solid rgba(212,175,106,.5);
    color:var(--gold-light);font-size:1.6rem;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;pointer-events:auto;transition:background .2s,transform .2s;
    user-select:none;opacity:0;
  }
  #ui:hover .arrow{opacity:1;}
  .arrow:hover{background:rgba(212,175,106,.35);transform:translateY(-50%) scale(1.08);}
  .arrow.left{left:20px;} .arrow.right{right:20px;}
  #bottombar{
    position:absolute;left:0;right:0;bottom:0;padding:14px 22px;
    display:flex;align-items:center;gap:14px;pointer-events:auto;
    background:linear-gradient(to top,rgba(0,0,0,.35),transparent);
  }
  #progressTrack{flex:1;height:4px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden;}
  #progressFill{height:100%;width:0%;background:var(--gold);}
  .ctrlbtn{background:transparent;border:none;color:var(--gold-light);font-size:1.25rem;cursor:pointer;padding:4px 8px;opacity:.85;}
  .ctrlbtn:hover{opacity:1;color:var(--gold);}
  #counter{color:var(--gold-light);font-size:.85rem;min-width:60px;text-align:center;opacity:.8;}
</style>
</head>
<body>
<div id="stage"></div>
<audio id="bgm" loop preload="auto" src="music.mp3"></audio>
<div id="ui">
  <div class="arrow left" id="prevBtn">&#10094;</div>
  <div class="arrow right" id="nextBtn">&#10095;</div>
  <div id="bottombar">
    <button class="ctrlbtn" id="playBtn" title="נגן/עצור">&#10074;&#10074;</button>
    <div id="progressTrack"><div id="progressFill"></div></div>
    <span id="counter">1 / 1</span>
    <button class="ctrlbtn" id="musBtn" title="מוזיקה">&#9835;</button>
    <button class="ctrlbtn" id="fsBtn" title="מסך מלא">&#9974;</button>
  </div>
</div>

const NAME = "רוזט";

function src(k){ return 'images/' + IMG[k]; }

const stage = document.getElementById('stage');
const els = [];

DECK.forEach((s, i) => {
  const div = document.createElement('div');
  div.className = 'slide ' + s.type + (i % 2 ? ' alt' : '');

  if(s.type === 'photo'){
    const wrap = document.createElement('div');
    wrap.className = 'imgwrap';
    const bg = document.createElement('img');
    bg.className = 'bgimg'; bg.src = src(s.bg);
    const vig = document.createElement('div'); vig.className = 'vignette';
    const fg = document.createElement('img');
    fg.className = 'fgimg'; fg.src = src(s.fg);
    wrap.append(bg, vig, fg);
    div.appendChild(wrap);

  } else if(s.type === 'collage'){
    const box = document.createElement('div');
    box.className = 'box';
    s.cells.forEach(c => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.left   = (c.rect[0]*100) + '%';
      cell.style.top    = (c.rect[1]*100) + '%';
      cell.style.width  = (c.rect[2]*100) + '%';
      cell.style.height = (c.rect[3]*100) + '%';
      const im = document.createElement('img');
      im.src = src(c.key);
      cell.appendChild(im);
      box.appendChild(cell);
    });
    div.appendChild(box);

  } else if(s.type === 'divider'){
    const statHtml = s.stat
      ? `<div class="divider-stat"><b>${s.stat[0]}</b></div>` : '';
    div.innerHTML = `<div class="divider-inner">
        <div class="divider-flourish">&#10022;&#10022;&#10022;</div>
        <h2 class="divider-title">${s.title}</h2>
        <div class="divider-line"></div>
        ${statHtml}
      </div>`;

  } else if(s.type === 'stats'){
    const cells = s.items.map(it =>
      `<div class="stat"><div class="num">${it[0]}</div><div class="lbl">${it[1]}</div></div>`).join('');
    div.innerHTML = `<div class="stats-inner">
        <div class="stats-eyebrow">המשפחה שרוזט בנתה</div>
        <p class="stats-head">הדורות שממשיכים אותה</p>
        <div class="stats-total">${s.total}</div>
        <div class="stats-total-label">צאצאים</div>
        <div class="stats-row">${cells}</div>
        <div class="stats-foot">וכל אחד ואחת מהם &mdash; פרק בסיפור שלה &#10084;</div>
      </div>`;

  } else if(s.type === 'title'){
    div.innerHTML = `<div class="title-inner">
        <div class="title-eyebrow">בשמחה ובאהבה</div>
        <p class="title-main">מזל טוב</p>
        <p class="title-name">${NAME}</p>
        <p class="title-sub">ל-90!</p>
        <div class="hearts">&#10084; &#10084; &#10084;</div>
      </div>
      <div class="start-hint">לחצו בכל מקום כדי להתחיל &#9835;</div>`;

  } else if(s.type === 'closing'){
    div.innerHTML = `<div class="closing-inner">
        <p class="closing-title">90 שנים של אהבה, חוכמה<br>וחיבוק חם שלא נגמר.</p>
        <p class="closing-sub">מזל טוב, ${NAME} שלנו &#10084;<br>באהבה, כל המשפחה</p>
      </div>`;
  }

  stage.appendChild(div);
  els.push(div);
});

let idx = 0, playing = false, timer = null, progRAF = null;
const DUR = { photo:4000, collage:5000, divider:2800, stats:7000, title:1e9, closing:1e9 };

function show(i, opts){
  opts = opts || {};
  idx = (i + els.length) % els.length;
  els.forEach((el,j) => el.classList.toggle('active', j === idx));
  els[idx].querySelectorAll('img, .box').forEach(n => {
    n.style.animation = 'none'; void n.offsetWidth; n.style.animation = '';
  });
  document.getElementById('counter').textContent = (idx+1)+' / '+els.length;
  preloadAhead(idx+1, 4);
  resetProgress();
  if(playing && !opts.noAdvance) scheduleNext();
}
function scheduleNext(){
  clearTimeout(timer);
  const t = DECK[idx].type;
  if(t === 'title' || t === 'closing') return;
  const d = DUR[t] || 4200;
  startProgress(d);
  timer = setTimeout(() => show(idx+1), d);
}
function next(){ clearTimeout(timer); show(idx+1); }
function prev(){ clearTimeout(timer); show(idx-1); }
function setPlaying(p){
  playing = p;
  if(p) startMusic();
  document.getElementById('playBtn').innerHTML = p ? '&#10074;&#10074;' : '&#9658;';
  if(p) scheduleNext(); else { clearTimeout(timer); cancelAnimationFrame(progRAF); }
}
function startProgress(dur){
  const fill = document.getElementById('progressFill');
  const t0 = performance.now();
  cancelAnimationFrame(progRAF);
  (function step(t){
    const pct = Math.min(100, ((t-t0)/dur)*100);
    fill.style.width = pct+'%';
    if(pct < 100 && playing) progRAF = requestAnimationFrame(step);
  })(t0);
}
function resetProgress(){ document.getElementById('progressFill').style.width = '0%'; }

document.getElementById('nextBtn').onclick = e => { e.stopPropagation(); next(); };
document.getElementById('prevBtn').onclick = e => { e.stopPropagation(); prev(); };
document.getElementById('playBtn').onclick = e => { e.stopPropagation(); setPlaying(!playing); };
// ---- background music -------------------------------------------------
const bgm = document.getElementById('bgm');
const musBtn = document.getElementById('musBtn');
let musicWanted = true, fadeTimer = null;

bgm.volume = 0;
function fadeTo(target, ms){
  clearInterval(fadeTimer);
  const from = bgm.volume, steps = Math.max(1, Math.round(ms/50));
  let i = 0;
  fadeTimer = setInterval(() => {
    i++;
    bgm.volume = Math.min(1, Math.max(0, from + (target-from)*(i/steps)));
    if(i >= steps) clearInterval(fadeTimer);
  }, 50);
}
let musicBroken = false;
bgm.addEventListener('error', () => {
  musicBroken = true;
  musBtn.style.display = 'none';       // no music.mp3 next to index.html
});
function startMusic(){
  if(!musicWanted || musicBroken) return;
  if(bgm.paused){
    bgm.play().then(() => fadeTo(0.60, 2500)).catch(()=>{});
  }
}
function updateMusBtn(){
  musBtn.innerHTML = musicWanted ? '&#9835;' : '&#9834;';
  musBtn.style.opacity = musicWanted ? '0.95' : '0.4';
  musBtn.title = musicWanted ? 'כבה מוזיקה' : 'הפעל מוזיקה';
}
musBtn.onclick = e => {
  e.stopPropagation();
  musicWanted = !musicWanted;
  if(musicWanted){ startMusic(); }
  else { fadeTo(0, 600); setTimeout(() => bgm.pause(), 650); }
  updateMusBtn();
};
updateMusBtn();

document.getElementById('fsBtn').onclick = e => {
  e.stopPropagation();
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
};
stage.onclick = () => {
  if(DECK[idx].type === 'title'){ startMusic(); setPlaying(true); show(idx+1); return; }
  setPlaying(!playing);
};
document.addEventListener('keydown', e => {
  if(e.key === 'ArrowLeft') prev();
  else if(e.key === 'ArrowRight') next();
  else if(e.code === 'Space'){ e.preventDefault(); setPlaying(!playing); }
});
let tx = null;
stage.addEventListener('touchstart', e => { tx = e.touches[0].clientX; });
stage.addEventListener('touchend', e => {
  if(tx === null) return;
  const dx = e.changedTouches[0].clientX - tx;
  if(Math.abs(dx) > 40){ dx > 0 ? prev() : next(); }
  tx = null;
});

// ---- image prefetching ------------------------------------------------
const _seen = new Set();
function preloadKeys(keys){
  keys.forEach(k => {
    if(_seen.has(k)) return;
    _seen.add(k);
    const im = new Image(); im.src = src(k);
  });
}
function keysOf(s){
  if(s.type === 'photo')   return [s.fg, s.bg];
  if(s.type === 'collage') return s.cells.map(c => c.key);
  return [];
}
function preloadAhead(from, n){
  for(let j = from; j < Math.min(from+n, DECK.length); j++) preloadKeys(keysOf(DECK[j]));
}
// warm the first few slides, then trickle through the rest in the background
preloadAhead(0, 4);
let _bgIdx = 0;
const _bgTimer = setInterval(() => {
  if(_bgIdx >= DECK.length){ clearInterval(_bgTimer); return; }
  preloadKeys(keysOf(DECK[_bgIdx++]));
}, 220);

show(0, {noAdvance:true});
</script>
</body>
